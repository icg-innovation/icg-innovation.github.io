---
layout: default
---
<article class="project-page">
  <header class="project-header">
    <h1>{{ page.title }}</h1>
    {% if page.summary %}
      <p class="project-summary">{{ page.summary }}</p>
    {% endif %}
    <div class="project-links">
      {% if page.github %}<a href="{{ page.github }}" class="btn" target="_blank" rel="noopener noreferrer">View on GitHub</a>{% endif %}
      {% if page.paper %}<a href="{{ page.paper }}" class="btn" target="_blank" rel="noopener noreferrer">Read the Paper</a>{% endif %}
    </div>
  </header>
  <hr>
  <div class="project-content">
    {{ content }}
  </div>
</article>
